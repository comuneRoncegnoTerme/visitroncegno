services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visitroncegno-web
    restart: unless-stopped
    environment:
      DIRECTUS_URL: ${DIRECTUS_URL:-http://164.132.85.146:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      CONTENT_HUB_SESSION_SECRET: ${CONTENT_HUB_SESSION_SECRET:-}
      CONTENT_HUB_ALLOWED_ROLES: ${CONTENT_HUB_ALLOWED_ROLES:-}
      CONTENT_HUB_COOKIE_SECURE: ${CONTENT_HUB_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
