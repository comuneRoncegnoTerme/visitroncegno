services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visitroncegno-web
    restart: unless-stopped
    environment:
      DIRECTUS_URL: ${DIRECTUS_URL:?DIRECTUS_URL must be configured}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      DIRECTUS_IMAGE_TRANSFORMS: ${DIRECTUS_IMAGE_TRANSFORMS:-true}
      MEMORIA_ARCHIVE_URL: ${MEMORIA_ARCHIVE_URL:-}
      DIRECTUS_PUBLIC_ASSET_URL: ${DIRECTUS_PUBLIC_ASSET_URL:-}
      CONTENT_HUB_SESSION_SECRET: ${CONTENT_HUB_SESSION_SECRET:-}
      CONTENT_HUB_ALLOWED_ROLES: ${CONTENT_HUB_ALLOWED_ROLES:-}
      # Vuoto = automatico (Secure quando il proxy segnala HTTPS con X-Forwarded-Proto).
      CONTENT_HUB_COOKIE_SECURE: ${CONTENT_HUB_COOKIE_SECURE:-}
    ports:
      # Con il server web (nginx/Caddy) sullo stesso VPS impostare WEBSITE_BIND_ADDRESS=127.0.0.1
      # nel file .env: Next non sarà più raggiungibile direttamente sulla porta 3000.
      # Il valore predefinito lascia invariato il comportamento attuale.
      - "${WEBSITE_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
